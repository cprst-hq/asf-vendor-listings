name: Nightly Vendor Rebuild

on:
  schedule:
    # Runs at 3:00 AM Central time every night (8:00 UTC)
    - cron: '0 8 * * *'
  # Also allows you to trigger a manual rebuild from GitHub anytime
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run build script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node build.js

      - name: Commit and push updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Nightly vendor rebuild $(date +'%Y-%m-%d')"
          git push
